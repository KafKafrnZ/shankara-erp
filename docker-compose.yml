version: '3.8'

services:
  # 1. Primary Database (Source of Truth for ingested facts)
  postgres:
    image: postgres:16-alpine
    container_name: shankara-postgres
    environment:
      POSTGRES_USER: shankara_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: shankara_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shankara_admin -d shankara_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Connection Pooler (Crucial for 5000+ users)
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: shankara-pgbouncer
    environment:
      DB_USER: shankara_admin
      DB_PASSWORD: supersecretpassword
      DB_HOST: postgres
      DB_NAME: shankara_erp
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 3. Redis (For Sessions, Hot Caching, and BullMQ Background Jobs)
  redis:
    image: redis:7-alpine
    container_name: shankara-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  # 4. OpenSearch (The "Google-like" Search Engine for Vouchers/Ledgers)
  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: shankara-opensearch
    environment:
      - cluster.name=shankara-search-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true # Disabled for local dev simplicity
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - osdata:/usr/share/opensearch/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  osdata:
