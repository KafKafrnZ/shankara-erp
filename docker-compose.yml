version: '3.8'

# This only runs the data tier (Postgres/pgbouncer/redis/OpenSearch). The
# backend and frontend run as their own processes on the host, not as
# containers here — see backend's "npm run start:dev" / frontend's
# "npm run dev" in the project README, and ops/Caddyfile + ops/README.md
# for how they're wired up for a real (non-dev) deployment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: shankara-postgres
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shankara_admin} -d ${POSTGRES_DB:-shankara_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: shankara-pgbouncer
    env_file:
      - ./backend/.env
    environment:
      DB_USER: ${DATABASE_USER:-shankara_admin}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${DATABASE_NAME:-shankara_erp}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shankara-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: shankara-opensearch
    environment:
      - cluster.name=shankara-search-cluster
      - node.name=opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - osdata:/usr/share/opensearch/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  osdata:
