version: '3.8'

# This only runs the data tier (Postgres/pgbouncer/redis). The
# backend and frontend run as their own processes on the host, not as
# containers here — see backend's "npm run start:dev" / frontend's
# "npm run dev" in the project README, and ops/Caddyfile + ops/README.md
# for how they're wired up for a real (non-dev) deployment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: shankara-postgres
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shankara_admin} -d ${POSTGRES_DB:-shankara_erp}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: shankara-pgbouncer
    env_file:
      - ./backend/.env
    # DB_USER/DB_PASSWORD below use Compose's ${} host-side substitution, which
    # only reads a .env file at the repo root (NOT the env_file: above, which
    # only injects into the container). A repo-root `.env` must exist —
    # normally a symlink to backend/.env (`New-Item -ItemType SymbolicLink
    # -Path .env -Target backend\.env`, elevated, on Windows; `ln -s` on
    # Linux, see docs/DEPLOYMENT.md) so it never drifts out of sync. Without
    # it, DATABASE_PASSWORD silently resolves blank and pgbouncer fails all
    # auth to Postgres — this took down prod on 2026-09-05.
    environment:
      DB_USER: ${DATABASE_USER:-shankara_admin}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      DB_HOST: postgres
      DB_NAME: ${DATABASE_NAME:-shankara_erp}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 50
    ports:
      - "127.0.0.1:6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: shankara-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
